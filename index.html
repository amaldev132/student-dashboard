<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Student Progress Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loginPage" class="container">

<h1>Student Progress Dashboard</h1>

<div class="loginBox">

<button class="btn" onclick="loginAdmin()">Admin Login</button>
<button class="btn" onclick="loginTeacher()">Teacher Login</button>

<input type="text" id="studentNameLogin" placeholder="Student Name">

<button class="btn" onclick="loginStudent()">Student Login</button>

</div>

</div>


<div id="dashboard" class="container" style="display:none;">

<div class="topBar">

<div>
<button onclick="logout()">Logout</button>
<button onclick="exportCSV()">Export Report</button>
</div>

<input type="text" id="searchBox" placeholder="Search student..." onkeyup="searchStudent()">

</div>


<!-- ADMIN CONTROL PANEL -->

<div id="adminPanel" class="adminPanel" style="display:none;">

<h3>Admin Controls</h3>

<div class="adminControls">

<input type="text" id="newStudentName" placeholder="Student Name">

<input type="number" id="newStudentProp" placeholder="PROP">

<input type="number" id="newStudentBg" placeholder="BG">

<input type="number" id="newStudentComp" placeholder="COMP">

<button onclick="addStudent()">Add Student</button>

<input type="number" id="deleteStudentIndex" placeholder="Student SL">

<button onclick="deleteStudent()">Delete Student</button>

</div>

</div>


<div class="tableWrap">

<table>

<thead>

<tr>
<th>SL</th>
<th>NAME</th>
<th>PROP</th>
<th>BG</th>
<th>TTL</th>
<th>COMP</th>
<th>STATUS</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>



<div id="passwordModal" class="modal">

<div class="modalBox">

<h3 id="modalTitle">Enter Password</h3>

<input type="password" id="passwordInput" placeholder="Password">

<div class="modalButtons">
<button onclick="submitPassword()">Login</button>
<button onclick="closeModal()">Cancel</button>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
