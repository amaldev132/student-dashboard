<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Progress Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- PARTICLES -->
<div id="particles"></div>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page-login">
  <div class="login-glow"></div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon-wrap">
        <div class="login-icon-ring"></div>
        <div class="login-icon-ring ring2"></div>
        <div class="login-icon">⚡</div>
      </div>
      <h1 class="login-title">PROGRESS<br><span>DASHBOARD</span></h1>
      <p class="login-sub">Track student project milestones</p>
      <div class="login-line"></div>
    </div>
    <div class="login-body">
      <div class="login-row">
        <button class="btn-role btn-admin" onclick="loginAdmin()">
          <span class="btn-role-glow"></span>
          <span class="btn-icon">🔐</span>
          <span class="btn-label">Admin</span>
          <span class="btn-arrow">→</span>
        </button>
        <button class="btn-role btn-teacher" onclick="loginTeacher()">
          <span class="btn-role-glow"></span>
          <span class="btn-icon">🎓</span>
          <span class="btn-label">Teacher</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
      <div class="login-divider"><span>STUDENT ACCESS</span></div>
      <div class="student-login-row">
        <input type="text" id="studentNameLogin" placeholder="Enter your name…" class="input-student" autocomplete="off">
        <button class="btn-student-go" onclick="loginStudent()">
          <span>GO</span>
          <span class="go-arrow">⚡</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page-dashboard" style="display:none;">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-text">PROGRESS</span>
    </div>
    <div class="sidebar-divider"></div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <span class="nav-dot"></span>
        <span>Students</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn-export" onclick="exportCSV()">
        <span>⬇</span> Export CSV
      </button>
      <button class="btn-logout" onclick="logout()">
        <span>←</span> Logout
      </button>
    </div>
  </aside>

  <main class="main-content">

    <header class="dash-header">
      <div class="dash-title">
        <h2 id="dashTitle">Student Records</h2>
        <span id="roleTag" class="role-tag"></span>
      </div>
      <div class="dash-right">
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span>LIVE</span>
        </div>
        <div class="dash-search">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchBox" placeholder="Search student…" onkeyup="searchStudent()">
        </div>
      </div>
    </header>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
      <div class="admin-panel-title">
        <span class="admin-pulse"></span>
        ⚙ Admin Controls
      </div>
      <div class="admin-grid">
        <div class="admin-group">
          <label>Add Student</label>
          <div class="admin-row">
            <input type="text"   id="newStudentName" placeholder="Name">
            <input type="number" id="newStudentProp" placeholder="PROP">
            <input type="number" id="newStudentBg"   placeholder="BG">
            <input type="number" id="newStudentComp" placeholder="COMP">
            <button class="btn-add" onclick="addStudent()">+ Add</button>
          </div>
        </div>
        <div class="admin-group">
          <label>Delete by SL</label>
          <div class="admin-row">
            <input type="number" id="deleteStudentIndex" placeholder="SL No.">
            <button class="btn-delete-sl" onclick="deleteStudent()">🗑 Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-header-bar">
        <span class="table-title-label">STUDENT RECORDS</span>
        <span class="table-count" id="tableCount">— students</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>SL</th>
              <th>NAME</th>
              <th>PROP</th>
              <th>BG</th>
              <th>TTL</th>
              <th>COMP</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-glow"></div>
    <div class="modal-icon">🔑</div>
    <h3 id="modalTitle">Enter Password</h3>
    <input type="password" id="passwordInput" placeholder="Password…" class="modal-input">
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn-login"  onclick="submitPassword()">Login ⚡</button>
    </div>
  </div>
</div>

<!-- Firebase App (loaded as ES module via script.js) -->
<script type="module" src="/script.js"></script>

<script>
// ─── Background canvas animation ───────────────────────────
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height= window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height= window.innerHeight;
});

const lines = [];
for(let i = 0; i < 8; i++){
  lines.push({
    x:       Math.random() * canvas.width,
    y:       Math.random() * canvas.height,
    angle:   Math.random() * Math.PI * 2,
    speed:   0.2 + Math.random() * 0.3,
    length:  100 + Math.random() * 200,
    opacity: 0.03 + Math.random() * 0.05,
    color:   Math.random() > 0.5 ? '100,200,255' : '150,100,255'
  });
}

function drawBg(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  lines.forEach(l => {
    l.x += Math.cos(l.angle) * l.speed;
    l.y += Math.sin(l.angle) * l.speed;
    if(l.x < -200)               l.x = canvas.width  + 200;
    if(l.x > canvas.width  + 200) l.x = -200;
    if(l.y < -200)               l.y = canvas.height + 200;
    if(l.y > canvas.height + 200) l.y = -200;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x + Math.cos(l.angle) * l.length,
               l.y + Math.sin(l.angle) * l.length);
    ctx.strokeStyle = 'rgba(' + l.color + ',' + l.opacity + ')';
    ctx.lineWidth   = 1;
    ctx.stroke();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// ─── Floating particles ─────────────────────────────────────
const particleContainer = document.getElementById('particles');
for(let i = 0; i < 30; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    width:${2+Math.random()*3}px;
    height:${2+Math.random()*3}px;
    animation-delay:${Math.random()*8}s;
    animation-duration:${6+Math.random()*6}s;
    opacity:${0.1+Math.random()*0.3};
  `;
  particleContainer.appendChild(p);
}
</script>

</body>
</html>
