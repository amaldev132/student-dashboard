<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Progress Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page-login">
  <div class="login-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">📊</div>
      <h1>Progress<br><span>Dashboard</span></h1>
      <p class="login-sub">Track student project milestones</p>
    </div>
    <div class="login-body">
      <div class="login-row">
        <button class="btn-role btn-admin" onclick="loginAdmin()">
          <span class="btn-icon">🔐</span>
          <span>Admin</span>
        </button>
        <button class="btn-role btn-teacher" onclick="loginTeacher()">
          <span class="btn-icon">🎓</span>
          <span>Teacher</span>
        </button>
      </div>
      <div class="login-divider"><span>or login as student</span></div>
      <div class="student-login-row">
        <input type="text" id="studentNameLogin" placeholder="Enter your name…" class="input-student">
        <button class="btn-student-go" onclick="loginStudent()">Go →</button>
      </div>
    </div>
  </div>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="page-dashboard" style="display:none;">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-icon">📊</span>
      <span>Progress</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">📋 Students</div>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn-logout" onclick="logout()">← Logout</button>
    </div>
  </aside>

  <main class="main-content">

    <header class="dash-header">
      <div class="dash-title">
        <h2 id="dashTitle">Student Records</h2>
        <span id="roleTag" class="role-tag"></span>
      </div>
      <div class="dash-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBox" placeholder="Search student…" onkeyup="searchStudent()">
      </div>
    </header>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
      <div class="admin-panel-title">⚙ Admin Controls</div>
      <div class="admin-grid">
        <div class="admin-group">
          <label>Add Student</label>
          <div class="admin-row">
            <input type="text" id="newStudentName" placeholder="Name">
            <input type="number" id="newStudentProp" placeholder="PROP">
            <input type="number" id="newStudentBg" placeholder="BG">
            <input type="number" id="newStudentComp" placeholder="COMP">
            <button class="btn-add" onclick="addStudent()">+ Add</button>
          </div>
        </div>
        <div class="admin-group">
          <label>Delete by SL</label>
          <div class="admin-row">
            <input type="number" id="deleteStudentIndex" placeholder="SL No.">
            <button class="btn-delete-sl" onclick="deleteStudent()">🗑 Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>SL</th>
            <th>NAME</th>
            <th>PROP</th>
            <th>BG</th>
            <th>TTL</th>
            <th>COMP</th>
            <th>STATUS</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </main>
</div>


<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-icon">🔑</div>
    <h3 id="modalTitle">Enter Password</h3>
    <input type="password" id="passwordInput" placeholder="Password…" class="modal-input">
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn-login" onclick="submitPassword()">Login</button>
    </div>
  </div>
</div>

<script src="/script.js"></script>
<script>
const _origOpen = openDashboard;
openDashboard = function(){
  _origOpen();
  const tag = document.getElementById('roleTag');
  if(tag) tag.textContent = role.toUpperCase();
  const title = document.getElementById('dashTitle');
  if(title && role==='student') title.textContent = 'Welcome, ' + currentStudent;
}
</script>
</body>
</html>
